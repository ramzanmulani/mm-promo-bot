name: Publish approved post

on:
  schedule:
    # Hourly. Does nothing unless something is waiting in state/pending.json.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: mm-promo-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check approval and publish
        env:
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_POST_WEBHOOK_URL: ${{ secrets.DISCORD_POST_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN:     ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID:    ${{ secrets.DISCORD_CHANNEL_ID }}
          IG_USER_ID:            ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID:            ${{ secrets.FB_PAGE_ID }}
          META_PAGE_TOKEN:       ${{ secrets.META_PAGE_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN:   ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_TOKEN_ISSUED: ${{ secrets.LINKEDIN_TOKEN_ISSUED }}
          PUBLIC_BASE_URL:       ${{ secrets.PUBLIC_BASE_URL }}
        run: python -m bot.publish

      - name: Commit state
        if: always()
        run: |
          git config user.name  "mm-promo-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add state
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "promo: update state [skip ci]"
            git push
          fi
