name: Cancel pending post

# Ye webhook mode ka veto hai. Ek click - queue me jo post hai wo hat jayega.
on:
  workflow_dispatch:

concurrency:
  group: mm-promo-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN:   ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID:  ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python -m bot.cancel
      - name: Commit state
        run: |
          git config user.name  "mm-promo-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add state
          git diff --cached --quiet || (git commit -m "promo: cancel pending [skip ci]" && git push)
