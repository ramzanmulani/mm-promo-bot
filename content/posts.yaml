    headline: "Stop guessing\nwhy your shot\nfeels wrong."
    sub: "Live shot reviews with frame-by-frame notes you can act on."
    bullets:
      - "Arcs, spacing, weight - diagnosed live"
      - "You leave with fixes, not theory"
      - "Free demo session, no card needed"
    cta: "Book your free demo"
    cta_link: mentorship
    caption_hook: "\"Something feels off\" is not feedback. It's a symptom."
    caption_body: |
      Every animator has stared at a shot for two hours knowing it's broken and not knowing where. Usually it's one of four things - spacing, arcs, weight, or a pose that never read in the first place.

      In a 1:1 session we find the actual cause in minutes instead of days, and you walk away knowing how to spot it yourself next time.

      Free demo session to start. Bring the shot that's annoying you.
    hashtags: ["animationtips", "mayaanimation", "3danimation", "characteranimation", "animationmentor", "animationstudent", "vfx", "animation", "animator", "learnanimation"]

