mentorship:
  - id: mentor-01
    eyebrow: "1:1 MENTORSHIP"
    headline: "Learn animation\nfrom a film\nanimator."
    sub: "14+ years. Love and Monsters. Finch. Kingsglaive. Trollhunters."
    bullets:
      - "Live 1:1 sessions, not recorded lectures"
      - "Your shots, reviewed frame by frame"
      - "First demo session is free"
    cta: "Book a free demo"
    cta_link: mentorship
    caption_hook: "Most animation courses teach you software. Almost none teach you how a shot actually gets approved in a studio."
    caption_body: |
      I've spent 14+ years animating creatures and characters on films like Love and Monsters, Finch, Kingsglaive and Trollhunters.

      In my 1:1 mentorship I don't hand you a playlist. We sit on your shot, in your file, and I show you exactly what a supervisor would flag - weight, timing, arcs, silhouette, the stuff that decides whether a shot ships or comes back.

      First demo session is free. Come with a shot, leave with a plan.
    hashtags: ["animation", "3danimation", "mayaanimation", "characteranimation", "creatureanimation", "animationmentor", "vfx", "animationtips", "animator", "learnanimation"]

