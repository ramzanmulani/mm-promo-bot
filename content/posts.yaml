      - "Upgrade to 1:1 whenever you want"
    cta: "Browse the courses"
    cta_link: courses
    caption_hook: "Not everyone can do live sessions. So the whole workflow is recorded too."
    caption_body: |
      The pre-recorded courses cover the same process I use on production shots - reference, blocking, spacing, polish - laid out step by step so you can follow along whenever you actually have time to animate.

      Start there, and move to 1:1 mentorship when you want your own shots reviewed.
    hashtags: ["animationcourse", "learnanimation", "mayaanimation", "3danimation", "characteranimation", "animationtutorial", "animationstudent", "vfx", "animator", "onlinecourse"]

  - id: mentor-06
    eyebrow: "1:1 MENTORSHIP"
    headline: "From student\nreel to studio\nready."
    sub: "A clear path, reviewed by someone who's shipped on features."
    bullets:
      - "Where you are vs where studios hire"
      - "Shot-by-shot roadmap"
      - "Free demo session first"
    cta: "Book a free demo"
    cta_link: mentorship
    caption_hook: "The gap between a student reel and a hire-able reel is smaller than you think - and more specific than you think."
    caption_body: |
      It's usually 3 things: shot selection, body mechanics, and polish discipline. Not talent. Not years.

      In mentorship we map exactly where your work sits today, what studios are actually looking at, and the shortest honest route between the two.

      First demo session is free.
