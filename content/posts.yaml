      - "Reference breakdown to final polish"
      - "1:1, on your own shot"
    cta: "Start with a free demo"
    cta_link: mentorship
    caption_hook: "Bipeds get you noticed. Creatures get you hired."
    caption_body: |
      Very few animators can sell a four-legged run. Weight transfer, contact timing, spine overlap, drag on the tail - get one wrong and the whole shot reads like a toy.

      Creature animation is what I've done for over 14 years on shows like Love and Monsters, Finch and Trollhunters, and it's what I teach 1:1 - on your shot, in your file, at your pace.

      First session is a free demo.
    hashtags: ["creatureanimation", "quadruped", "animalanimation", "3danimation", "mayaanimation", "animationmentor", "vfx", "characteranimation", "animationtips", "animator"]

  - id: mentor-04
